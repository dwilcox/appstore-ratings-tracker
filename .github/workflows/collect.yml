name: Collect App Store Ratings

on:
  schedule:
    # Runs daily at 13:00 UTC (09:00 AST / 10:00 EDT)
    - cron: "0 13 * * *"
  workflow_dispatch:  # Allow manual triggering from the Actions tab

permissions:
  contents: write  # Needed to commit the updated DB and report

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection
        env:
          ASC_APP_ID: "1574359693"
          DB_PATH: "./reviews.db"
        run: python collect_reviews.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.db report.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily ratings update: $(date -u +%Y-%m-%d)"
            git push
          fi
